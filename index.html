<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracks Bar &amp; Grill Financial Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: MG brand band with tabs, then one 960px column per tab. Review tabs render from CONFIG objects; the budget tab renders from BUDGET data. */
:root{
  --bg:#FAF8FD; --surface:#FFFFFF; --ink:#1F1630; --muted:#615873; --line:#E5DEF0; --lav:#EDE7F6;
  --purple:#350072; --purple-ink:#350072; --magenta:#932787; --orange:#F7931E; --orange-ink:#A85C00;
  --teal:#009245; --teal-ink:#007A39; --sky:#1E9CD7; --neg:#B4234F; --fc:#B79BE0;
  --band:#350072; --band-fg:#FFFFFF; --band-muted:#D9C9F2;
  --display:"Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130A20; --surface:#1D1330; --ink:#F2EDF9; --muted:#B5AAC8; --line:#372A4D; --lav:#281B3D;
  --purple:#9B6BE0; --purple-ink:#C8A8F5; --magenta:#D267C2; --orange:#F7A440; --orange-ink:#F7B160;
  --teal:#22B565; --teal-ink:#4CD08A; --sky:#4DB5E6; --neg:#F07196; --fc:#5E4590;
  --band:#26104A; --band-fg:#FFFFFF; --band-muted:#CDB8EE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#130A20; --surface:#1D1330; --ink:#F2EDF9; --muted:#B5AAC8; --line:#372A4D; --lav:#281B3D;
  --purple:#9B6BE0; --purple-ink:#C8A8F5; --magenta:#D267C2; --orange:#F7A440; --orange-ink:#F7B160;
  --teal:#22B565; --teal-ink:#4CD08A; --sky:#4DB5E6; --neg:#F07196; --fc:#5E4590;
  --band:#26104A; --band-fg:#FFFFFF; --band-muted:#CDB8EE; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:700;color:var(--purple-ink)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.band{background:var(--band);color:var(--band-fg)}
.band .wrap{padding-block:20px 0;display:grid;gap:14px}
.bandtop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mark{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:linear-gradient(135deg,#932787 0%,#F7931E 100%)}
.logo b{font-family:var(--display);font-size:.95rem}
.band h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
.band .sub{color:var(--band-muted);font-size:.92rem;margin-top:4px}
.stripe{display:flex;gap:4px;padding-bottom:6px}
.stripe i{width:24px;height:5px;border-radius:3px;display:block}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:.92rem;color:var(--band-muted);background:transparent;border:0;border-radius:10px 10px 0 0;padding:10px 16px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--purple-ink)}
.tabs button:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}

main .wrap{padding-block:26px 44px}
.view{display:grid;gap:30px}
section{display:grid;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.archive{background:color-mix(in srgb,var(--orange) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 50%,transparent);border-radius:12px;padding:12px 16px;font-size:.9rem}

.summary{max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .k{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:1.5rem;font-weight:700}
.kpi .n{font-size:.78rem;color:var(--muted)}
.kpi.flagged{border-color:color-mix(in srgb,var(--orange) 70%,transparent)}
.kpi.flagged .n{color:var(--orange-ink);font-weight:600}

.bench{display:grid;grid-template-columns:120px minmax(0,1fr) max-content;column-gap:16px;align-items:center}
.brow{display:contents}
.brow>*{padding:10px 0;border-bottom:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.brow:last-child>*{border-bottom:0}
.brow b{font-family:var(--display);font-size:.98rem}
.track{position:relative;height:46px;min-width:0}
.track>span{margin-top:10px}
.rail{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--line)}
.bandr{position:absolute;top:6px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--teal) 28%,transparent);border:1px solid color-mix(in srgb,var(--teal) 60%,transparent)}
.mk{position:absolute;top:1px;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--purple-ink)}
.wa{position:absolute;top:3px;width:3px;height:20px;margin-left:-1.5px;border-radius:2px;background:var(--orange)}
.bval{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;font-size:.9rem}
.bval span{white-space:nowrap}
.bval strong{font-family:var(--display);font-size:1.05rem}
.legend{font-size:.78rem;color:var(--muted);margin-top:8px}
.chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.c-hi{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.c-mid{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange-ink)}
.c-ok{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-ink)}

.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.group h3{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta);padding:16px 0 2px}
.group:first-child h3{padding-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row.ro{grid-template-columns:1fr}
.group .row:last-child{border-bottom:0}
.row .what{display:grid;gap:3px;align-content:start;min-width:0}
.row .what b{font-family:var(--display);font-size:1rem}
.row .what span{font-size:.86rem;color:var(--muted)}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.chk input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--teal);flex:none;cursor:pointer}
.row .dnote{display:none}
.row.done{grid-template-columns:1fr;padding:6px 0}
.row.done .what>span:not(.dnote),.row.done .edit{display:none}
.row.done .what b{text-decoration:line-through;color:var(--muted);font-weight:600}
.row.done .dnote{display:block;font-size:.8rem;color:var(--muted);padding-left:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.priority .what b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:8px;vertical-align:middle}
.edit{display:grid;gap:6px;min-width:0}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
select{padding:5px 8px;font-size:.85rem;font-weight:600}
textarea{width:100%;min-height:44px;padding:8px 10px;font-size:.92rem;line-height:1.4;resize:vertical}
.stamp{font-size:.74rem;color:var(--muted)}
.st{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st-open{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.st-discussed{background:color-mix(in srgb,var(--sky) 18%,transparent);color:var(--sky)}
.st-waiting{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange-ink)}
.st-resolved{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal-ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.savestate{font-size:.82rem;color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:.86rem;padding:7px 14px;border-radius:8px;border:1px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer}
.btn:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.seg button:focus-visible,.box:focus-visible,tr.click:focus-visible{outline:3px solid color-mix(in srgb,var(--sky) 60%,transparent);outline-offset:2px}

details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details+details{margin-top:8px}
summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-weight:700;color:var(--purple-ink)}
details>div{padding:0 16px 16px;display:grid;gap:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr.sub td{font-weight:700;background:var(--lav)}
tr.total td{font-weight:800;border-top:2px solid var(--purple)}
.note{font-size:.82rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
svg text{font-family:var(--body)}

/* Budget */
.bctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.bctl .lab{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.seg button .tag{font-size:.7rem;opacity:.8;margin-left:4px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.box{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:3px;cursor:pointer;align-content:start}
.box:hover{border-color:var(--purple)}
.box[aria-pressed="true"]{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple);background:var(--lav)}
.box .k{font-size:.76rem;color:var(--muted);font-weight:600}
.box .v{font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.box .d{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.box.rev{border-top:3px solid var(--purple)}
.box.net{border-top:3px solid var(--teal)}
.up{color:var(--teal-ink)} .down{color:var(--neg)}
.detail{display:grid;gap:12px}
.detail h3{font-size:1.1rem;color:var(--purple-ink)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--lav)}
tr.sel td{background:var(--lav);font-weight:700}
.waiting{display:grid;gap:6px;justify-items:start}
.legendrow{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.key summary{font-size:1rem}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;padding:4px 16px 16px}
.keygrid div{display:grid;gap:2px;font-size:.84rem;align-content:start}
.keygrid b{font-family:var(--display);font-size:.86rem;color:var(--purple-ink)}
.keygrid span{color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bizview{display:grid;gap:30px}
.bizbar{padding:12px 18px}
.headline p:first-child{font-size:1.15rem;line-height:1.55;max-width:62ch}
.headline{display:grid;gap:8px}
.sboxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.sbox{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px;cursor:pointer;align-content:start}
.sbox:hover{border-color:var(--purple)}
.sbox[aria-pressed="true"]{background:var(--lav);box-shadow:inset 0 0 0 1px var(--purple)}
.sbox .k{font-weight:700;font-size:.9rem}
.sbox .v{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.sbox .cents{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--purple-ink);margin-top:4px}
.sbox .d{font-size:.78rem;color:var(--muted)}
.sb-in{border-top-color:var(--purple)} .sb-food{border-top-color:var(--magenta)} .sb-staff{border-top-color:var(--sky)} .sb-other{border-top-color:var(--orange)} .sb-left{border-top-color:var(--teal)}
.whatif{display:grid;gap:14px}
.whatif .q{font-weight:700;margin-bottom:6px}
.mlist{display:grid;max-width:420px}
.mlist div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.mlist .tot{border-bottom:0;border-top:2px solid var(--purple);font-weight:800}
.how ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.how h3{font-size:1rem;color:var(--purple-ink)}
details.inner{border:0;background:transparent}
details.inner summary{padding:6px 0;font-size:.9rem}
details.inner>div{padding:0}
table.simple td,table.simple th{font-size:.92rem;padding:8px}
@media (max-width:760px){.sboxes{grid-template-columns:1fr 1fr}}
.thsub{display:block;font-size:.62rem;font-weight:600;letter-spacing:.02em;text-transform:none}
.mcallouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mcallouts div{display:grid;gap:2px;background:var(--lav);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.mcallouts .k{font-size:.74rem;color:var(--muted);font-weight:600}
.mcallouts b{font-family:var(--display);font-size:1.05rem}
@media (max-width:760px){.mcallouts{grid-template-columns:1fr}}
footer .wrap{padding-block:16px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
footer b{color:var(--purple-ink);font-family:var(--display)}

@media (max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}
  .bench{grid-template-columns:1fr}
  .brow>*{border-bottom:0;padding:4px 0}
  .brow>.bval{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px;justify-content:flex-start;flex-wrap:wrap}
  .brow:last-child>.bval{border-bottom:0}
  .track>span{margin-top:4px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="bandtop">
      <div>
        <div class="logo"><div class="mark" aria-hidden="true">MG</div><b>MG Business Solutions</b></div>
        <h1 id="bandTitle">The Tracks Bar &amp; Grill</h1>
        <p class="sub" id="bandSub"></p>
      </div>
      <div class="stripe" aria-hidden="true"><i style="background:#932787"></i><i style="background:#F7931E"></i><i style="background:#009245"></i><i style="background:#1E9CD7"></i></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Report views">
      <button role="tab" id="tab-review" aria-controls="view-review" data-view="review">This week · Nov 24</button>
      <button role="tab" id="tab-nov-11" aria-controls="view-nov-11" data-view="nov-11">Last meeting · Nov 11</button>
      <button role="tab" id="tab-budget" aria-controls="view-budget" data-view="budget">Budget &amp; forecast</button>
    </div>
  </div>
</header>

<main><div class="wrap">
  <div class="view" id="view-review" role="tabpanel" aria-labelledby="tab-review"></div>
  <div class="view" id="view-nov-11" role="tabpanel" aria-labelledby="tab-nov-11" hidden></div>
  <div class="view" id="view-budget" role="tabpanel" aria-labelledby="tab-budget" hidden></div>
</div></main>

<footer><div class="wrap"><span><b>MG Business Solutions, LLC</b> · Phoenix, AZ</span><span>Prepared from unaudited QuickBooks records for management review only.</span></div></footer>

<script>
/* ===== CONFIG: this week's review ===== */
const CONFIG={
  period:'Financial review · Jan 1 – Nov 24, 2026 · Updated from QuickBooks Nov 24, 2026',
  summary:'Sales are steady at about $38.7K a month, and labor is actually below the Washington average. The gap is food and liquor cost, which runs about 10 points above Washington peers. QuickBooks shows $38.6K of net income, which is likely overstated because sales tax hasn’t been fully taken out of sales. Three items from you will let us finish the books.',
  kpis:[
    {k:'Sales',v:'$413.3K',n:'Jan 1 – Nov 24'},
    {k:'Net income (booked)',v:'$38.6K',n:'Closer to $24.7K after sales tax gap',flag:true},
    {k:'Prime cost',v:'75.7%',n:'Typical: 55–65%',flag:true},
    {k:'Owed by Little Crane',v:'$47.6K',n:'No change since Nov 11'}
  ],
  bench:{max:80,note:'Green band = typical U.S. range for full-service restaurants. Orange tick = Washington full-service average (WA Hospitality Association, Restaurant Dollar Report). Purple mark = The Tracks, as % of sales. QuickBooks regional peers (WA full-service): yearly profit $29,722 vs. $20,924 for The Tracks.',rows:[
    {k:'Prime cost',v:75.7,lo:55,hi:65,wa:68.2,s:'hi',t:'Above WA avg'},
    {k:'Food & liquor',v:39.5,lo:28,hi:35,wa:28.8,s:'hi',t:'Well above'},
    {k:'Labor',v:36.6,lo:30,hi:35,wa:39.4,s:'ok',t:'Below WA avg'},
    {k:'Net margin',v:9.3,lo:3,hi:8,wa:1.5,s:'mid',t:'Overstated'}
  ]},
  agenda:[
    {group:'We need from you',items:[
      {id:'loan',p:1,t:'Loan payments to Little Crane',d:'$2,737.17 goes to Little Crane every month ($30.1K YTD). Which loan is it, whose is it, and can we get the statement?'},
      {id:'salestax',p:1,t:'Accurate sales tax data',d:'Our estimate is 4–5% of deposits; DOR payments run 8–9%. Need 2026 excise returns or DOR access, plus the B&O split. October’s payment is due Nov 25.'},
      {id:'kwick',p:1,t:'New Kwick POS PIN',d:'Our PIN can’t run company-wide reports. Need a manager or owner PIN with sales, tax and payment reports.'}
    ]},
    {group:'Quick questions',items:[
      {id:'rent',t:'Rent or mortgage',d:'None recorded. Does Tracks pay rent, or is the Little Crane payment a building loan?'},
      {id:'acct0723',t:'Account ending 0723',d:'Sept–Oct transfers came from it. Whose account is it?'},
      {id:'cash',t:'Cash withdrawals, $2,225',d:'June–August. What was the cash for?'},
      {id:'affirm',t:'Affirm payment, $570.40',d:'January 9. What was purchased?'},
      {id:'utilities',t:'Garbage & internet',d:'Utilities rose $586 since Nov 11. Confirm garbage and internet are now current.'},
      {id:'hawknet',t:'HawkNet charge, $68.85',d:'November 4. Ask Mark what this charge is for and whether it recurs.'}
    ]},
    {group:'MG to do',items:[
      {id:'recon',t:'Reconcile checking x4046',d:'Book balance is $2,259.54 as of Nov 24 (was ($2,402.72) on Nov 11).'},
      {id:'bsni',t:'Tie balance sheet to P&L',d:'Balance sheet shows $11,990.92 YTD net income; the P&L shows $38,641.18. Check fiscal year and closing settings.'},
      {id:'peacock',t:'Recode $18.34 streaming charge',d:'Out of owner draws, into entertainment.'}
    ]}
  ],
  detail:[
    {title:'Monthly sales',type:'bars',months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov*'],
      values:[34436,28711,32901,39413,40540,48290,44330,43236,39702,35040,26696],note:'QuickBooks income by month. *November through the 24th.'},

      mode='db';
      if(user){try{myId=await user.id();}catch(e){} try{if(await user.can('data.write')===false){mode='readonly';lockAll();}}catch(e){}}
      const timer=setTimeout(()=>setSave('Saved notes can’t be reached yet. Edits will save when the connection returns.'),10000);
      db.collection('notes').onSnapshot(snap=>{
        if(!snap.metadata.fromCache){clearTimeout(timer); if(/^(Loading|Saved notes can)/.test(saveText())) setSave(mode==='readonly'?'View-only: notes can’t be changed here.':'All notes saved');}
        snap.docs.forEach(d=>{ if(!state[d.id]||pending[d.id]||writing[d.id])return; const v=d.data()||{};
          state[d.id]={status:LABEL[v.status]?v.status:'open',note:typeof v.note==='string'?v.note:'',updatedAt:v.updatedAt||null,updatedBy:v.updatedBy||null}; fill(d.id);});
        paintTally();paintStamps();
      },()=>{clearTimeout(timer);setSave('Notes stopped syncing. Reload the page to reconnect.');});
    })();
  })();

  /* ---------- Budget & forecast ---------- */
  const B={co:'tracks',growth:0,cogs:null,box:'in',month:null};
  const GROWTH=[-5,0,3,5];

  function catSum(accts,cat,key){return accts.filter(a=>a.cat===cat).reduce((s,a)=>s+a[key],0);}
  function computeCompany(c){
    const d=c.data, A=d.accounts;
    const revY1=catSum(A,'rev','y1'), revY2=catSum(A,'rev','y2');
    const hasCogs=catSum(A,'cogs','y2')!==0;
    const cogsPctCur=hasCogs?catSum(A,'cogs','y2')/revY2:0, payPct=catSum(A,'payroll','y2')/revY2;
    const cogsPct=!hasCogs?0:(B.cogs==null?cogsPctCur:B.cogs/100);
    const g=1+B.growth/100, scale=d.method==='runrate'?12/d.activeMonths:1;
    const rev=BUDGET.forecastLabels.map((_,i)=>d.method==='runrate'?d.runrate*g:(d.income[i]+d.income[i+12])/2*g);
    const revTot=rev.reduce((a,b)=>a+b,0);
    const flatCats=CATS.filter(k=>k.kind==='flat').map(k=>k.id);
    const monthly=rev.map(r=>{const m={rev:r,cogs:r*cogsPct,payroll:r*payPct};flatCats.forEach(k=>m[k]=catSum(A,k,'y2')*scale/12);m.excluded=0;return m;});
    const budgetFor=a=>{
      if(a.cat==='rev') return revTot;
      if(a.cat==='cogs'){const t=catSum(A,'cogs','y2');return t?a.y2/t*revTot*cogsPct:0;}
      if(a.cat==='payroll'){const t=catSum(A,'payroll','y2');return t?a.y2/t*revTot*payPct:0;}
      if(a.cat==='excluded') return 0;
      return a.y2*scale;
    };
    const accounts=A.map(a=>Object.assign({},a,{company:c.name,budget:budgetFor(a)}));
    return {months:d.months,income:d.income,cogsHist:d.cogs,expHist:d.expenses,monthly,accounts,cogsPctCur:hasCogs?cogsPctCur:null,payPct,revY1,revY2};
  }
  function compute(){
    const loaded=BUDGET.companies.filter(c=>c.data);
    const pick=B.co==='all'?loaded:loaded.filter(c=>c.id===B.co);
    if(!pick.length) return null;
    const parts=pick.map(computeCompany);
    const sumArr=(k)=>parts[0][k].map((_,i)=>parts.reduce((s,p)=>s+p[k][i],0));
    const monthly=parts[0].monthly.map((_,i)=>{const m={};CATS.forEach(k=>m[k.id]=parts.reduce((s,p)=>s+(p.monthly[i][k.id]||0),0));return m;});
    return {months:parts[0].months,income:sumArr('income'),cogsHist:sumArr('cogsHist'),expHist:sumArr('expHist'),monthly,
      accounts:parts.flatMap(p=>p.accounts),multi:pick.length>1,cogsPctCur:parts.length===1?parts[0].cogsPctCur:null,hasCogs:parts.some(p=>p.cogsPctCur!=null),count:pick.length,runrate:pick.some(c=>c.data.method==='runrate')};
  }
  const expenseCats=CATS.filter(k=>k.kind!=='rev'&&k.kind!=='zero').map(k=>k.id);
  const netOf=m=>m.rev-expenseCats.reduce((s,k)=>s+m[k],0);

  function renderBudget(){
    const root=$('view-budget');
    const R=compute();
    const coBtns=[...BUDGET.companies.map(c=>({id:c.id,label:c.name})),{id:'all',label:'All three together'}];
    const coName=B.co==='all'?'the three businesses together':(BUDGET.companies.find(c=>c.id===B.co)||{}).name;
    let html=`<section><div class="panel bctl bizbar"><div><div class="lab">Business</div><div class="seg" role="group" aria-label="Business">${coBtns.map(b=>`<button type="button" data-co="${b.id}" aria-pressed="${B.co===b.id}">${esc(b.label)}</button>`).join('')}</div></div></div></section>`;
    if(!R){ root.innerHTML=html+`<section><div class="panel waiting"><h3>Waiting for numbers</h3><p class="muted">Send this business’s monthly profit & loss and the plan fills in here.</p></div></section>`; wireBudget(); return; }
    const tot=k=>R.monthly.reduce((s,m)=>s+m[k],0);
    const last=k=>R.accounts.filter(a=>a.cat===k).reduce((s,a)=>s+a.y2,0);
    const groups=SIMPLE.map(g=>({...g,f:g.cats.reduce((s,k)=>s+tot(k),0),l:g.cats.reduce((s,k)=>s+last(k),0)})).filter((g,i)=>i===0||g.f||g.l);
    const inF=groups[0].f, outF=groups.slice(1).reduce((s,g)=>s+g.f,0), left=inF-outF;
    const inL=groups[0].l, outL=groups.slice(1).reduce((s,g)=>s+g.l,0), leftL=inL-outL;
    const r=v=>'$'+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(2)+' million':Math.round(Math.abs(v)/1000).toLocaleString('en-US')+'K');
    const diff=left-leftL;
    html+=`<section><h2>The next 12 months at a glance</h2>
      <div class="panel headline"><p>From <b>November 2026 to October 2027</b>, we expect ${esc(coName)} to bring in about <b>${r(inF)}</b> and spend about <b>${r(outF)}</b>, ${left>=0?`for a <b class="up">profit of about ${r(left)}</b> (what’s left over)`:`for a <b class="down">loss of about ${r(left)}</b> (costs more than sales)`}.</p>
      <p class="muted">${Math.abs(diff)<1000?'That’s about the same as the last 12 months.':`That’s about ${r(diff)} ${diff>0?'more':'less'} profit than the last 12 months${B.growth||B.cogs!=null?', because of the “what if” choices below':''}.`}</p></div></section>`;
    html+=`<section><h2>Where each dollar goes</h2><p class="note">Click a box to see what’s inside it.</p><div class="sboxes">${groups.map((g,i)=>{
        const cents=i===0?'':`<span class="cents">${Math.round(g.f/inF*100)}¢</span><span class="d">of every sales dollar</span>`;
        return `<button type="button" class="sbox sb-${g.id}" data-box="${g.id}" aria-pressed="${B.box===g.id&&B.month==null}"><span class="k">${esc(g.name)}</span><span class="v">${kfmt(g.f)}</span>${cents}<span class="d">${esc(g.desc)}</span></button>`;}).join('')}
        <button type="button" class="sbox sb-left" data-box="left" aria-pressed="${B.box==='left'&&B.month==null}"><span class="k">${left>=0?'Profit':'Loss'}</span><span class="v ${left>=0?'up':'down'}">${kfmt(left)}</span><span class="cents">${Math.round(left/inF*100)}¢</span><span class="d">of every sales dollar</span><span class="d">${left>=0?'What’s left over after all costs':'Costs are more than sales'}</span></button>
      </div><div class="panel detail" id="bDetail"></div></section>`;
    const showCogs=R.hasCogs;
    html+=`<section><h2>What if…</h2><div class="panel whatif">
      <div><div class="q">What if sales change?</div><div class="seg" role="group" aria-label="Sales change">${GROWTH.map(g=>`<button type="button" data-g="${g}" aria-pressed="${B.growth===g}">${g===0?'Stay the same':(g>0?'Up ':'Down ')+Math.abs(g)+'%'}</button>`).join('')}</div></div>
      ${showCogs?`<div><div class="q">What if food & supply costs come down?</div><div class="seg" role="group" aria-label="Food and supply cost">${[{v:null,l:'Stay as now'+(R.cogsPctCur!=null?` (${Math.round(R.cogsPctCur*100)}¢ per $1)`:'')},{v:37,l:'37¢ per $1'},{v:35,l:'35¢ per $1'}].map(o=>`<button type="button" data-cogs="${o.v}" aria-pressed="${B.cogs===o.v}">${o.l}</button>`).join('')}</div></div>`:''}
      <p class="note">Every number on this tab updates when you pick an option.</p></div></section>`;
    html+=`<section><h2>Sales by month</h2><div class="panel"><div class="legendrow"><span><i style="background:var(--purple)"></i>What actually came in (last 2 years)</span><span><i style="background:var(--fc)"></i>What we expect</span></div>
      <div class="scroll"><svg class="chart" id="bChart" viewBox="0 0 960 260" role="img" aria-label="Monthly sales, last two years and next twelve months expected"></svg></div><p class="note">Click a light bar, or a month below, to see that month.</p></div></section>`;
    const showFood=groups.some(g=>g.id==='food'), showStaff=groups.some(g=>g.id==='staff');
    const mg=R.monthly.map(m=>({in:m.rev,food:m.cogs,staff:m.payroll,other:expenseCats.filter(k=>k!=='cogs'&&k!=='payroll').reduce((s,k)=>s+m[k],0)})).map(x=>({...x,profit:x.in-x.food-x.staff-x.other}));
    const pl=v=>`<span class="${v<0?'down':'up'}">${money(Math.abs(v))} ${v<0?'loss':'profit'}</span>`;
    const best=mg.reduce((a,x,i)=>x.profit>mg[a].profit?i:a,0), worst=mg.reduce((a,x,i)=>x.profit<mg[a].profit?i:a,0);
    html+=`<section><h2>Month by month</h2>
      <div class="panel"><p class="note" style="margin-bottom:8px">Each bar is one month’s expected sales, split into where the money goes. Click a bar to see that month.</p>
      <div class="legendrow">${showFood?'<span><i style="background:var(--magenta)"></i>Food & supplies</span>':''}${showStaff?'<span><i style="background:var(--sky)"></i>Staff</span>':''}<span><i style="background:var(--orange)"></i>Everything else</span><span><i style="background:var(--teal)"></i>Profit</span><span><i style="background:var(--neg)"></i>Loss</span></div>
      <div class="scroll"><svg class="chart" id="bStack" viewBox="0 0 960 300" role="img" aria-label="Expected monthly sales split into food and supplies, staff, everything else and profit"></svg></div>
      <div class="mcallouts">${Math.round(mg[best].profit)===Math.round(mg[worst].profit)?`<div><span class="k">Every month</span><b>About the same</b><span class="note">Based on a recent monthly average, not seasons</span></div>`:`<div><span class="k">Best month</span><b>${BUDGET.forecastLabels[best]}</b>${pl(mg[best].profit)}</div>
        <div><span class="k">Toughest month</span><b>${BUDGET.forecastLabels[worst]}</b>${pl(mg[worst].profit)}</div>`}
        <div><span class="k">Average month</span><b>${money(inF/12)} in</b>${pl(left/12)}</div></div></div>
      <div class="panel"><div class="scroll"><table class="simple"><thead><tr><th>Month</th><th>Coming in</th>${showFood?'<th>Food & supplies</th>':''}${showStaff?'<th>Staff</th>':''}<th>Everything else</th><th>Profit<span class="thsub">what’s left over</span></th><th>Profit per $1</th></tr></thead><tbody>${
      mg.map((x,i)=>`<tr class="click${B.month===i?' sel':''}" tabindex="0" data-month="${i}"><td>${BUDGET.forecastLabels[i]}</td><td>${money(x.in)}</td>${showFood?`<td>${money(x.food)}</td>`:''}${showStaff?`<td>${money(x.staff)}</td>`:''}<td>${money(x.other)}</td><td class="${x.profit<0?'down':'up'}">${money(x.profit)}</td><td class="${x.profit<0?'down':''}">${Math.round(x.profit/x.in*100)}¢</td></tr>`).join('')
      }<tr class="total"><td>Next 12 months</td><td>${money(inF)}</td>${showFood?`<td>${money(tot('cogs'))}</td>`:''}${showStaff?`<td>${money(tot('payroll'))}</td>`:''}<td>${money(outF-tot('cogs')-tot('payroll'))}</td><td class="${left<0?'down':''}">${money(left)}</td><td>${Math.round(left/inF*100)}¢</td></tr></tbody></table></div></div></section>`;
    const notes=B.co==='all'?BUDGET.companies.filter(c=>c.data).flatMap(c=>(BUDGET.notes[c.id]||[]).map(n=>c.name+': '+n)):(BUDGET.notes[B.co]||[]);
    html+=`<section><div class="panel how"><h3>How we built this</h3><ul>
        <li>We looked at the last two years of sales, month by month, so busy and slow seasons repeat.</li>
        <li>Food, supplies and staff go up and down with sales. Everything else stays about where it was this past year.</li>
        <li>One-time and clean-up items are left out.</li></ul></div></section>`;
    root.innerHTML=html;
    drawForecast(R);
    drawStack(R);
    renderDetail(R,groups,inF);
    wireBudget();
  }

  const FRIENDLY={rev:'Sales',cogs:'Food & supplies',payroll:'Staff',insurance:'Insurance',utilities:'Utilities (power, water, garbage, internet)',fees:'Card processing & bank fees',repairs:'Repairs & small supplies',taxes:'Taxes & licenses',occupancy:'Rent, mortgage & equipment leases',interest:'Interest on loans & cards',admin:'Office, marketing & other'};
  const SIMPLE=[
    {id:'in',name:'Money coming in',desc:'Sales',cats:['rev']},
    {id:'food',name:'Food & supplies',desc:'What goes on the plate and in the glass',cats:['cogs']},
    {id:'staff',name:'Staff',desc:'Wages and payroll taxes',cats:['payroll']},
    {id:'other',name:'Everything else',desc:'Utilities, insurance, fees, repairs and more',cats:['insurance','utilities','fees','repairs','taxes','occupancy','interest','admin']}
  ];
  const clean=n=>n.replace(/^[\d.]+\s+/,'').replace(/\{[^}]*\}\s*/g,'').replace(/\s*\|\s*COGS/,'');

  function renderDetail(R,groups,inF){
    const box=$('bDetail'); if(!box) return;
    if(B.month!=null){
      const m=R.monthly[B.month], i=B.month;
      const g=SIMPLE.map(x=>({n:x.name,v:x.cats.reduce((s,k)=>s+m[k],0)}));
      const out=g.slice(1).reduce((s,x)=>s+x.v,0);
      box.innerHTML=`<h3>${BUDGET.forecastLabels[i]}</h3>
        <div class="mlist">${g.map((x,j)=>`<div><span>${j?'− ':''}${esc(x.n)}</span><b>${money(x.v)}</b></div>`).join('')}<div class="tot"><span>${m.rev-out>=0?'Profit (what’s left over)':'Loss'}</span><b class="${m.rev-out<0?'down':'up'}">${money(m.rev-out)}</b></div></div>
        <p class="note">For comparison, ${R.months[i+12]} brought in ${money(R.income[i+12])} and ${R.months[i]} brought in ${money(R.income[i])}.</p>`;
      return;
    }
    if(B.box==='left'){
      box.innerHTML=`<h3>How we get to profit</h3><div class="mlist">${groups.map((x,j)=>`<div><span>${j?'− ':''}${esc(x.name)}</span><b>${money(x.f)}</b></div>`).join('')}
        <div class="tot"><span>Profit (what’s left over)</span><b>${money(groups[0].f-groups.slice(1).reduce((s,x)=>s+x.f,0))}</b></div></div>`;
      return;
    }
    const g=SIMPLE.find(x=>x.id===B.box)||SIMPLE[0];
    const rows=g.cats.map(k=>{const f=R.monthly.reduce((s,m)=>s+m[k],0),l=R.accounts.filter(a=>a.cat===k).reduce((s,a)=>s+a.y2,0);return {k,f,l};}).filter(x=>x.f||x.l);
    const accts=R.accounts.filter(a=>g.cats.includes(a.cat)&&(a.y2||a.budget));
    box.innerHTML=`<h3>${esc(g.name)}</h3>
      <div class="scroll"><table class="simple"><thead><tr><th>What it is</th><th>Last 12 months</th><th>Next 12 months</th><th>Per month</th></tr></thead><tbody>${
        rows.map(x=>`<tr><td>${esc(FRIENDLY[x.k])}</td><td>${money(x.l)}</td><td>${money(x.f)}</td><td>${money(x.f/12)}</td></tr>`).join('')}</tbody></table></div>
      <details class="inner"><summary>Show the QuickBooks accounts</summary><div class="scroll"><table><thead><tr><th>Account</th><th>Nov 24 – Oct 25</th><th>Nov 25 – Oct 26</th><th>Next 12 months</th></tr></thead><tbody>${
        accts.map(a=>`<tr><td>${R.multi?`<span class="muted">${esc(a.company)} · </span>`:''}${esc(clean(a.name))}</td><td>${money(a.y1)}</td><td>${money(a.y2)}</td><td>${money(a.budget)}</td></tr>`).join('')}</tbody></table></div></details>`;
  }

  function drawStack(R){
    const svg=$('bStack'); if(!svg) return;
    const mg=R.monthly.map(m=>{const other=expenseCats.filter(k=>k!=='cogs'&&k!=='payroll').reduce((s,k)=>s+m[k],0);return {in:m.rev,segs:[['food',m.cogs,'var(--magenta)'],['staff',m.payroll,'var(--sky)'],['other',other,'var(--orange)']],profit:m.rev-m.cogs-m.payroll-other};});
    const W=960,H=300,L=60,Rr=10,T=16,Bm=34;
    const top=Math.max(...mg.map(x=>Math.max(x.in,x.in-x.profit))), bot=Math.min(0,...mg.map(x=>x.profit));
    const stepV=top>200000?50000:top>40000?10000:2000;
    const max=Math.ceil(top/stepV)*stepV, min=bot<0?-Math.ceil(-bot/stepV)*stepV:0;
    const y=v=>T+(H-T-Bm)*(max-v)/(max-min), step=(W-L-Rr)/12, bw=step*.62;
    const el=(t,a,txt,par)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(par||svg).appendChild(e);return e;};
    for(let t=min;t<=max;t+=stepV){el('line',{x1:L,x2:W-Rr,y1:y(t),y2:y(t),stroke:t===0?'var(--muted)':'var(--line)'});el('text',{x:L-8,y:y(t)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},(t<0?'-$':'$')+Math.abs(t)/1000+'K');}
    mg.forEach((x,i)=>{
      const gx=L+i*step+(step-bw)/2, g=el('g',{});
      g.style.cursor='pointer';
      let base=0;
      x.segs.forEach(([k,v,c])=>{ if(v<=0) return; el('rect',{x:gx,y:y(base+v),width:bw,height:y(base)-y(base+v),fill:c},null,g); base+=v; });
      if(x.profit>0) el('rect',{x:gx,y:y(base+x.profit),width:bw,height:y(base)-y(base+x.profit),fill:'var(--teal)'},null,g);
      else if(x.profit<0) el('rect',{x:gx,y:y(0),width:bw,height:y(x.profit)-y(0),fill:'var(--neg)'},null,g);
      if(B.month===i) el('rect',{x:gx-2,y:y(Math.max(x.in,base))-2,width:bw+4,height:y(Math.min(0,x.profit))-y(Math.max(x.in,base))+4,fill:'none',stroke:'var(--purple-ink)','stroke-width':2,rx:3},null,g);
      el('title',{},`${BUDGET.forecastLabels[i]}: ${money(x.in)} in, ${money(x.profit)} ${x.profit<0?'loss':'profit'}`,g);
      el('text',{x:gx+bw/2,y:x.profit<0?y(x.profit)+13:y(Math.max(x.in,base))-5,'text-anchor':'middle','font-size':11,'font-weight':700,fill:x.profit<0?'var(--neg)':'var(--teal-ink)'},(x.profit<0?'-':'+')+'$'+(Math.abs(x.profit)/1000).toFixed(1)+'K',g);
      el('text',{x:gx+bw/2,y:H-12,'text-anchor':'middle','font-size':12,fill:'var(--muted)'},BUDGET.forecastLabels[i].replace(/ 20(\d\d)$/," ’$1"),g);
      g.addEventListener('click',()=>{B.month=i;renderBudget();const d=$('bDetail');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'});});
    });
  }

  function drawForecast(R){
    const svg=$('bChart'); if(!svg) return;
    const vals=[...R.income,...R.monthly.map(m=>m.rev)], labels=[...R.months,...BUDGET.forecastLabels];
    const W=960,H=260,L=56,Rr=10,T=16,Bm=40;
    const stepV=Math.max(...vals)>200000?50000:Math.max(...vals)>40000?10000:2000;
    const max=Math.ceil(Math.max(...vals)/stepV)*stepV, y=v=>T+(H-T-Bm)*(1-v/max), step=(W-L-Rr)/vals.length, bw=step*.7;
    const el=(t,a,txt,par)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(par||svg).appendChild(e);return e;};
    for(let t=0;t<=max;t+=stepV){el('line',{x1:L,x2:W-Rr,y1:y(t),y2:y(t),stroke:'var(--line)'});el('text',{x:L-8,y:y(t)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},'$'+t/1000+'K');}
    el('line',{x1:L+24*step,x2:L+24*step,y1:T,y2:H-Bm+4,stroke:'var(--muted)','stroke-dasharray':'4 4'});
    el('text',{x:L+24*step+6,y:T+10,'font-size':11,fill:'var(--muted)'},'Expected →');
    vals.forEach((v,j)=>{const x=L+j*step+(step-bw)/2, fc=j>=24;
      const r=el('rect',{x,y:y(Math.max(0,v)),width:bw,height:Math.abs(y(0)-y(Math.max(0,v))),rx:2,fill:fc?'var(--fc)':'var(--purple)'});
      el('title',{},labels[j]+': '+money(v),r);
      if(fc){r.style.cursor='pointer'; if(B.month===j-24){r.setAttribute('stroke','var(--orange)');r.setAttribute('stroke-width','2');}
        r.addEventListener('click',()=>{B.month=j-24;renderBudget();const d=$('bDetail');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'});});}
      if(j%3===0) el('text',{x:x+bw/2,y:H-Bm+18,'text-anchor':'middle','font-size':11,fill:'var(--muted)'},labels[j].replace(/ 20(\d\d)$/," ’$1"));
    });
  }

  function wireBudget(){
    const root=$('view-budget');
    root.querySelectorAll('[data-co]').forEach(b=>b.addEventListener('click',()=>{B.co=b.dataset.co;B.month=null;renderBudget();}));
    root.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{B.growth=+b.dataset.g;renderBudget();}));
    root.querySelectorAll('[data-cogs]').forEach(b=>b.addEventListener('click',()=>{B.cogs=b.dataset.cogs==='null'?null:+b.dataset.cogs;renderBudget();}));
    root.querySelectorAll('[data-box]').forEach(b=>b.addEventListener('click',()=>{B.box=b.dataset.box;B.month=null;renderBudget();const d=$('bDetail');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'});}));
    root.querySelectorAll('tr[data-month]').forEach(r=>{const go=()=>{B.month=+r.dataset.month;renderBudget();const d=$('bDetail');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'});};
      r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
  }
  renderBudget();

  /* ---------- Tabs (hash routed) ---------- */
  function updateBand(){
    const v=typeof current==='undefined'?'review':current, b=BIZ.find(x=>x.id===biz);
    if(v==='budget'){$('bandTitle').textContent='Tracks, Little Crane & Daley Storage';$('bandSub').textContent='Budget & forecast · Nov 2026 – Oct 2027 · From QuickBooks P&L';return;}
    if(v==='nov-11'){$('bandTitle').textContent='The Tracks Bar & Grill';$('bandSub').textContent=CONFIG_PREV.period;return;}
    $('bandTitle').textContent=b.name; $('bandSub').textContent=REVIEWS.cur[biz].period;
  }
  const VIEWS=['review','nov-11','budget']; let current='review';
  function show(v){
    if(!VIEWS.includes(v)) v='review';
    VIEWS.forEach(x=>{$('view-'+x).hidden=x!==v; $('tab-'+x).setAttribute('aria-selected',x===v); $('tab-'+x).tabIndex=x===v?0:-1;});
    current=v; updateBand();
  }
  document.querySelectorAll('.tabs button').forEach((b,i,all)=>{
    b.addEventListener('click',()=>{location.hash=b.dataset.view;show(b.dataset.view);});
    b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=all[(i+(e.key==='ArrowRight'?1:all.length-1))%all.length];n.focus();n.click();}});
  });
  window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
